# Declare inputs for schedule UI configuration.
# Bridged to $PIPELINE to keep .gitlab/ci/rules.yml evaluation consistent.

spec:
  inputs:
    PIPELINE:
      description: "Pipeline mode: badges, stable, prerelease, pages, or empty for a regular run"
      default: ""

---
# Routing only. Job definitions live in .gitlab/ci/, trigger definitions in
# .gitlab/ci/rules.yml.

stages:
  - validate
  - test
  - package
  - deploy

default:
  interruptible: true

variables:
  PIPELINE: $[[ inputs.PIPELINE ]]
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  # A 500 from the git endpoint fails the job before the script even starts,
  # which says nothing about this project. Retry the fetch instead.
  GET_SOURCES_ATTEMPTS: "3"
  ARTIFACT_DOWNLOAD_ATTEMPTS: "3"

# A schedule must name its purpose, otherwise it silently inherits the whole
# pipeline.  The guard checks both null (variable undefined) and empty string
# (spec:inputs default) so a misconfigured schedule is still rejected.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && ($PIPELINE == null || $PIPELINE == "")'
      when: never
    - when: always

include:
  - local: .gitlab/ci/rules.yml
  - local: .gitlab/ci/validate.yml
  - local: .gitlab/ci/test.yml
  - local: .gitlab/ci/release.yml
  - local: .gitlab/ci/badges.yml
  - local: .gitlab/ci/pages.yml
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
