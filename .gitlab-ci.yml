# Declare inputs for schedules and manual runs.
# Bridged to $PIPELINE and $TAG to keep .gitlab/ci/rules.yml evaluation consistent.

spec:
  inputs:
    PIPELINE:
      description: "Pipeline mode: badges, stable, prerelease, pages, release-dry-run, release-backfill, or empty for a regular run"
      default: ""
      regex: ^(badges|stable|prerelease|pages|release-dry-run|release-backfill)?$
    TAG:
      description: "Existing release tag for release-backfill, such as v1.0.4"
      default: ""
      regex: ^(v[0-9]+\.[0-9]+\.[0-9]+)?$

---
# Routing only. Job definitions live in .gitlab/ci/, trigger definitions in
# .gitlab/ci/rules.yml.

stages:
  - validate
  - test
  - report
  - package
  - publish
  - release
  - deploy

default:
  interruptible: true

variables:
  PIPELINE: $[[ inputs.PIPELINE ]]
  TAG: $[[ inputs.TAG ]]
  # A 500 from the git endpoint fails the job before the script even starts,
  # which says nothing about this project. Retry the fetch instead.
  GET_SOURCES_ATTEMPTS: "3"
  ARTIFACT_DOWNLOAD_ATTEMPTS: "3"

# A schedule must name its purpose, otherwise it silently inherits the whole
# pipeline.  The guard checks both null (variable undefined) and empty string
# (spec:inputs default) so a misconfigured schedule is still rejected.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && ($PIPELINE == null || $PIPELINE == "")'
      when: never
    # Scans only on commits and the weekly stable run. Compare explicitly:
    # inside &&, an empty $PIPELINE is truthy.
    - if: '$PIPELINE != "" && $PIPELINE != "stable"'
      variables:
        SAST_DISABLED: "true"
        SECRET_DETECTION_DISABLED: "true"
        DEPENDENCY_SCANNING_DISABLED: "true"
    - when: always

include:
  - local: .gitlab/ci/rules.yml
  - local: .gitlab/ci/validate.yml
  - local: .gitlab/ci/test.yml
  - local: .gitlab/ci/coverage.yml
  - local: .gitlab/ci/release.yml
  - local: .gitlab/ci/badges.yml
  - local: .gitlab/ci/pages.yml
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
