stages:
  - validate
  - test
  - publish

cache:
  paths:
    - test/node_modules/
    - node_modules/

validate:
  image: node:22
  stage: validate
  script:
    - node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
    - node scripts/check-themes-jsonc.js
    - node -e "JSON.parse(require('fs').readFileSync('schemas/arn-advanced.schema.json','utf8'))"
    - |
      node -e "
        const pkg = JSON.parse(require('fs').readFileSync('package.json','utf8'));
        const required = ['name','displayName','description','version','publisher','engines','contributes','main','license'];
        const missing = required.filter(k => !pkg[k]);
        if (missing.length) {
          console.error('package.json is missing required fields: ' + missing.join(', '));
          process.exit(1);
        }
        if (!pkg.contributes.themes || pkg.contributes.themes.length !== 7) {
          console.error('package.json must contribute exactly 7 themes (got ' + (pkg.contributes.themes||[]).length + ')');
          process.exit(1);
        }
      "

# --- UNIT TESTS ---
unit-tests-linux:
  image: node:22
  stage: test
  script:
    - cd test
    - npm ci
    - npm run test:unit



# --- INTEGRATION TESTS ---
integration-tests-linux:
  image: node:22
  stage: test
  before_script:
    - apt-get update && apt-get install -y libx11-xcb1 libxcb-dri3-0 libxtst6 libnss3 libxss1 libasound2 libgbm1 libatk1.0-0 libatk-bridge2.0-0 libgtk-3-0 xauth xvfb
  script:
    - cd test
    - npm ci
    - xvfb-run -a npm run test:integration



# --- PUBLISH ---
publish:
  image: node:22
  stage: publish
  needs:
    - validate
    - unit-tests-linux
    - integration-tests-linux
  only:
    - tags
  script:
    - cd test
    - npm ci
    - npm run test:unit
    - cd ..
    - |
      PKG_VERSION=$(node -p "require('./package.json').version")
      TAG_VERSION="${CI_COMMIT_TAG#v}"
      if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
        echo "Version mismatch — package.json says $PKG_VERSION, release tag is $TAG_VERSION."
        exit 1
      fi
    - npx --yes @vscode/vsce package -o antigravity-arn-skin.vsix
    - npx --yes @vscode/vsce publish --packagePath antigravity-arn-skin.vsix -p "$VSCE_PUBLISH"
    - npx --yes ovsx publish antigravity-arn-skin.vsix -p "$OPEN_VSX"

# --- BADGES UPDATE (SCHEDULED) ---
update-badges:
  image: node:22
  stage: publish
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  before_script:
    - apt-get update && apt-get install -y jq curl git
  script:
    - git clone --branch badges https://oauth2:${GITLAB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git /tmp/badges_repo
    - cd /tmp/badges_repo
    - mkdir -p .github/badges
    - |
      RESPONSE=$(curl -sS -X POST \
        -H "Content-Type: application/json" \
        -H "Accept: application/json;api-version=3.0-preview.1" \
        -d '{"flags":914,"filters":[{"criteria":[{"filterType":7,"value":"jzbakh.antigravity-arn-skin"}]}]}' \
        "https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery")
    - |
      VERSION=$(echo "$RESPONSE" | jq -r '(.results // [])[0] // {} | (.extensions // [])[0] // {} | (.versions // [])[0] // {} | (.version // "unknown")')
    - |
      DOWNLOADS=$(echo "$RESPONSE" | jq -r '(.results // [])[0] // {} | (.extensions // [])[0] // {} | (.statistics // []) | map(select(.statisticName == "install")) | (first // {value: 0}) | (.value // 0) | floor')
    - |
      if [ "$VERSION" != "unknown" ]; then
        DOWNLOADS_DISPLAY=$(if [ "$DOWNLOADS" -ge 1000000 ]; then awk -v n="$DOWNLOADS" 'BEGIN { printf "%.1fM", n/1000000 }'; elif [ "$DOWNLOADS" -ge 1000 ]; then awk -v n="$DOWNLOADS" 'BEGIN { printf "%.1fk", n/1000 }'; else echo "$DOWNLOADS"; fi)
        echo "{ \"schemaVersion\": 1, \"label\": \"VS Marketplace\", \"message\": \"v${VERSION}\", \"color\": \"blue\", \"namedLogo\": \"visualstudiocode\" }" > .github/badges/marketplace-version.json
        echo "{ \"schemaVersion\": 1, \"label\": \"Downloads\", \"message\": \"${DOWNLOADS_DISPLAY}\", \"color\": \"success\", \"namedLogo\": \"visualstudiocode\" }" > .github/badges/marketplace-downloads.json
      fi
    - |
      git config --global user.name "gitlab-ci[bot]"
      git config --global user.email "gitlab-ci[bot]@gitlab.com"
      git add .github/badges/
      if git diff --quiet --staged; then
        echo "Badges unchanged, nothing to commit."
      else
        git commit -m "chore(badges): refresh badge stats"
        git push origin badges
      fi

# --- GITLAB PAGES (HTML PRESENTATION) ---
pages:
  image: node:22
  stage: publish
  needs: []
  script:
    - mkdir -p public
    - cp -r html_presentation public/
    - cp -r media public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# --- SECURITE (SAST & SECRETS) ---
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

