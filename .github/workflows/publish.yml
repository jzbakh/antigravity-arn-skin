# Publish — MANUAL FALLBACK ONLY. GitLab CI owns publication: its tag pipeline
# tests, packages, and pushes to both registries. Run this workflow only when
# GitLab is unavailable; publishing the same version twice makes the second
# upload fail. Requires repo secrets VSCE_PUBLISH (Azure DevOps PAT, scope
# "Marketplace > Manage") and OPEN_VSX (Open VSX access token).

name: publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Marketplace + Open VSX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Run unit tests
        working-directory: test
        run: |
          npm ci
          npm run test:unit

      - name: Build the .vsix bundle
        run: npx --yes @vscode/vsce package -o antigravity-arn-skin.vsix

      - name: Publish to VSCode Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PUBLISH }}
        run: npx --yes @vscode/vsce publish --packagePath antigravity-arn-skin.vsix

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX }}
        run: npx --yes ovsx publish antigravity-arn-skin.vsix -p "$OVSX_PAT"
