# CI — mirrors the GitLab pipeline modes (.gitlab/ci/rules.yml), which owns
# releases. Each stage gates the next; if one fails the rest is skipped.
#
#   1) validate           — structural checks (manifest, theme JSONC)
#   2) unit               — pure-helper Mocha tests on Linux / macOS / Windows
#   3) integration-stable — vscode-test suite on the 3 OSes, current stable
#   4) integration-insiders — same suite on VSCode Insiders, monthly only
#
# Schedules: weekly runs the stable matrix, monthly adds Insiders.

name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'
    - cron: '0 8 1 * *'

# Cancel an in-flight run for the same branch / PR when a newer commit
# arrives — saves CI minutes during rapid iteration.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1 — fast structural validation. Fails the whole pipeline early on
  # obvious problems (corrupt JSON, missing manifest fields, bad schema).
  # ---------------------------------------------------------------------------
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate the manifest
        run: node scripts/validate-manifest.js

      - name: Validate every theme JSONC file
        run: node scripts/check-themes-jsonc.js

  # ---------------------------------------------------------------------------
  # Stage 2 — pure-helper unit tests. No editor, no network, ~1s on every OS.
  # ---------------------------------------------------------------------------
  unit:
    name: Unit (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
        working-directory: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: test/package-lock.json
      - name: Install test deps
        run: npm ci
      - name: Run unit tests
        run: npm run test:unit

  # ---------------------------------------------------------------------------
  # Stage 3 — integration tests against the latest VSCode stable.
  # ---------------------------------------------------------------------------
  integration-stable:
    name: Integration · stable (${{ matrix.os }})
    needs: unit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      VSCODE_VERSION: stable
    defaults:
      run:
        shell: bash
        working-directory: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: test/package-lock.json
      - name: Install test deps
        run: npm ci
      - name: Run integration tests (Linux, under xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Run integration tests (Windows / macOS)
        if: runner.os != 'Linux'
        run: npm run test:integration

  # ---------------------------------------------------------------------------
  # Stage 4 — integration tests against VSCode Insiders. Catches regressions in
  # upcoming editor releases before they ship. Monthly cron and manual dispatch
  # only, matching the GitLab `prerelease` schedule.
  # ---------------------------------------------------------------------------
  integration-insiders:
    name: Integration · insiders (${{ matrix.os }})
    if: github.event.schedule == '0 8 1 * *' || github.event_name == 'workflow_dispatch'
    needs: unit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      VSCODE_VERSION: insiders
    defaults:
      run:
        shell: bash
        working-directory: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: test/package-lock.json
      - name: Install test deps
        run: npm ci
      - name: Run integration tests (Linux, under xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Run integration tests (Windows / macOS)
        if: runner.os != 'Linux'
        run: npm run test:integration

  # ---------------------------------------------------------------------------
  # Aggregate gate — a single status check the maintainer can require in the
  # branch protection settings instead of selecting every matrix job by name.
  # Passes only when every required stage above has passed (or, in the
  # "skipped because not on cron" case for insiders, was legitimately skipped).
  # ---------------------------------------------------------------------------
  ci-passed:
    name: CI passed
    if: always()
    needs: [validate, unit, integration-stable]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm every required stage succeeded
        run: |
          if [ "${{ needs.validate.result }}" != "success" ]; then
            echo "Validate stage did not succeed: ${{ needs.validate.result }}"
            exit 1
          fi
          if [ "${{ needs.unit.result }}" != "success" ]; then
            echo "Unit stage did not succeed: ${{ needs.unit.result }}"
            exit 1
          fi
          if [ "${{ needs.integration-stable.result }}" != "success" ]; then
            echo "Integration · stable stage did not succeed: ${{ needs.integration-stable.result }}"
            exit 1
          fi
          echo "All required stages passed."
