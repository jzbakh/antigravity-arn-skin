# One VSIX per tag, published by one job per store: retry a failed store alone.

.release-node:
  image: node:22
  interruptible: false
  variables:
    VSCE: "@vscode/vsce@4.0.0"
    OVSX: "ovsx@1.2.0"

.release-glab:
  image: registry.gitlab.com/gitlab-org/cli:v1.120.0
  stage: release
  interruptible: false

package:
  extends:
    - .release-node
    - .on-release-build
  stage: package
  # Gates only: no test artifact may reach the package. Optional for the dry run.
  needs:
    - job: validate
      optional: true
      artifacts: false
    - job: lint
      optional: true
      artifacts: false
    - job: unit-tests-linux
      optional: true
      artifacts: false
    - job: unit-tests-macos
      optional: true
      artifacts: false
    - job: integration-tests-linux
      optional: true
      artifacts: false
    - job: integration-tests-windows
      optional: true
      artifacts: false
    - job: integration-tests-insiders-linux
      optional: true
      artifacts: false
    - job: integration-tests-insiders-windows
      optional: true
      artifacts: false
  script:
    - VERSION=$(node -p "require('./package.json').version")
    - |
      if [ -n "$CI_COMMIT_TAG" ] && [ "$CI_COMMIT_TAG" != "v$VERSION" ]; then
        echo "Tag $CI_COMMIT_TAG does not match package.json version $VERSION."
        exit 1
      fi
    - npx --yes "$VSCE" ls | LC_ALL=C sort | diff -u scripts/vsix-files.txt -
    - npx --yes "$VSCE" package -o arn-skin.vsix
    - sha256sum arn-skin.vsix
    # After packaging, so neither file lands in the VSIX.
    - sh scripts/release-notes.sh "$VERSION" > release-notes.md
    - echo "PACKAGE_JOB_ID=$CI_JOB_ID" > release.env
    - echo "VERSION=$VERSION" >> release.env
  artifacts:
    paths:
      - arn-skin.vsix
      - release-notes.md
    reports:
      dotenv: release.env
    expire_in: never

# An empty token makes vsce prompt; protected variables need a protected ref.
verify-tokens:
  extends:
    - .release-node
    - .on-release-build
  stage: package
  needs: []
  script:
    - '[ -n "$VSCE_PUBLISH" ] || { echo "VSCE_PUBLISH is not available on this ref."; exit 1; }'
    - '[ -n "$OPEN_VSX" ] || { echo "OPEN_VSX is not available on this ref."; exit 1; }'
    - npx --yes "$VSCE" verify-pat jzbakh -p "$VSCE_PUBLISH"
    - npx --yes "$OVSX" verify-pat jzbakh -p "$OPEN_VSX"

.publish:
  extends:
    - .release-node
    - .on-release
  stage: publish
  resource_group: release
  needs:
    - package
    - verify-tokens

publish:vs-marketplace:
  extends: .publish
  script:
    - npx --yes "$VSCE" publish --packagePath arn-skin.vsix --skip-duplicate -p "$VSCE_PUBLISH"

publish:open-vsx:
  extends: .publish
  script:
    - npx --yes "$OVSX" publish --packagePath arn-skin.vsix --skip-duplicate -p "$OPEN_VSX"

# By job id: the link keeps the VSIX the stores received.
release:gitlab:
  extends:
    - .release-glab
    - .on-release
  needs:
    - package
    - publish:vs-marketplace
    - publish:open-vsx
  script:
    - echo "Releasing $CI_COMMIT_TAG with the VSIX of job $PACKAGE_JOB_ID."
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: ./release-notes.md
    assets:
      links:
        - name: arn-skin.vsix
          url: $CI_PROJECT_URL/-/jobs/$PACKAGE_JOB_ID/artifacts/raw/arn-skin.vsix
          filepath: /arn-skin.vsix
          link_type: package
        - name: Visual Studio Marketplace
          url: https://marketplace.visualstudio.com/items?itemName=jzbakh.antigravity-arn-skin
          link_type: other
        - name: Open VSX
          url: https://open-vsx.org/extension/jzbakh/antigravity-arn-skin
          link_type: other

release:dry-run:
  extends:
    - .release-glab
    - .on-release-dry-run
  needs:
    - package
    - verify-tokens
  script:
    - cat release-notes.md
    - sha256sum arn-skin.vsix
    - echo "Dry run of v$VERSION complete; nothing was published."

backfill:fetch:
  extends:
    - .release-node
    - .on-release-backfill
  stage: package
  needs: []
  script:
    - node scripts/fetch-published-vsix.mjs "$TAG"
  artifacts:
    paths:
      - arn-skin.vsix
    reports:
      dotenv: release.env
    expire_in: never

# The release keyword takes no variable released_at, hence the CLI.
release:backfill:
  extends:
    - .release-glab
    - .on-release-backfill
  needs:
    - backfill:fetch
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  script:
    - sh scripts/release-notes.sh "${TAG#v}" > release-notes.md
    - |
      glab release create "$TAG" --no-update \
        --name "$TAG" \
        --notes-file release-notes.md \
        --released-at "$RELEASED_AT" \
        --assets-links "[
          {\"name\": \"arn-skin.vsix\", \"url\": \"$CI_PROJECT_URL/-/jobs/$FETCH_JOB_ID/artifacts/raw/arn-skin.vsix\", \"direct_asset_path\": \"/arn-skin.vsix\", \"link_type\": \"package\"},
          {\"name\": \"Visual Studio Marketplace\", \"url\": \"https://marketplace.visualstudio.com/items?itemName=jzbakh.antigravity-arn-skin\", \"link_type\": \"other\"},
          {\"name\": \"Open VSX\", \"url\": \"https://open-vsx.org/extension/jzbakh/antigravity-arn-skin\", \"link_type\": \"other\"}
        ]"
