# One VSIX per tag, published by one job per store: retry a failed store alone.

.release-node:
  image: node:22
  interruptible: false
  variables:
    VSCE: "@vscode/vsce@4.0.0"
    OVSX: "ovsx@1.2.0"

package:
  extends:
    - .release-node
    - .on-release
  stage: package
  needs:
    - validate
    - unit-tests-linux
    - unit-tests-macos
    - integration-tests-linux
    - integration-tests-windows
    - integration-tests-insiders-linux
    - integration-tests-insiders-windows
  script:
    - VERSION=$(node -p "require('./package.json').version")
    - |
      if [ "$CI_COMMIT_TAG" != "v$VERSION" ]; then
        echo "Tag $CI_COMMIT_TAG does not match package.json version $VERSION."
        exit 1
      fi
    - npx --yes "$VSCE" package -o arn-skin.vsix
    - sha256sum arn-skin.vsix
  artifacts:
    paths:
      - arn-skin.vsix
    expire_in: never

# An empty token makes vsce prompt; protected variables need a protected ref.
verify-tokens:
  extends:
    - .release-node
    - .on-release
  stage: package
  needs: []
  script:
    - '[ -n "$VSCE_PUBLISH" ] || { echo "VSCE_PUBLISH is not available on this ref."; exit 1; }'
    - '[ -n "$OPEN_VSX" ] || { echo "OPEN_VSX is not available on this ref."; exit 1; }'
    - npx --yes "$VSCE" verify-pat jzbakh -p "$VSCE_PUBLISH"
    - npx --yes "$OVSX" verify-pat jzbakh -p "$OPEN_VSX"

.publish:
  extends:
    - .release-node
    - .on-release
  stage: publish
  resource_group: release
  needs:
    - package
    - verify-tokens

publish:vs-marketplace:
  extends: .publish
  script:
    - npx --yes "$VSCE" publish --packagePath arn-skin.vsix --skip-duplicate -p "$VSCE_PUBLISH"

publish:open-vsx:
  extends: .publish
  script:
    - npx --yes "$OVSX" publish --packagePath arn-skin.vsix --skip-duplicate -p "$OPEN_VSX"

gitlab-release:
  extends: .on-release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  stage: release
  interruptible: false
  needs:
    - publish:vs-marketplace
    - publish:open-vsx
  script:
    - TAG_VERSION="${CI_COMMIT_TAG#v}"
    - echo "# What's new in v${TAG_VERSION} ?" > release_notes.md
    - echo "" >> release_notes.md
    - awk -v ver="[${TAG_VERSION}]" '/^## \[/ { if (p) exit; if (index($2, ver) == 1) { p=1; next } } p { print }' CHANGELOG.md >> release_notes.md
    - |
      release-cli create --name "Release $CI_COMMIT_TAG" \
        --tag-name "$CI_COMMIT_TAG" \
        --description "$(cat release_notes.md)" \
        --assets-link "{\"name\":\"Extension Binary (.vsix)\",\"url\":\"${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/arn-skin.vsix?job=package\",\"filepath\":\"/arn-skin.vsix\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"Download on VS Marketplace\",\"url\":\"https://marketplace.visualstudio.com/items?itemName=jzbakh.antigravity-arn-skin\",\"link_type\":\"other\"}" \
        --assets-link "{\"name\":\"Download on Open VSX\",\"url\":\"https://open-vsx.org/extension/jzbakh/antigravity-arn-skin\",\"link_type\":\"other\"}"
