# Packaging is split from publishing so a failure on one registry can be
# retried without rebuilding — and without replaying an already-accepted
# upload to the other registry.

package:
  extends: .on-release
  image: node:22
  stage: package
  interruptible: false
  needs:
    - validate
    - unit-tests-linux
    - unit-tests-macos
    - integration-tests-linux
    - integration-tests-windows
    - integration-tests-insiders-linux
    - integration-tests-insiders-windows
  script:
    - |
      PKG_VERSION=$(node -p "require('./package.json').version")
      TAG_VERSION="${CI_COMMIT_TAG#v}"
      if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
        echo "Version mismatch — package.json says $PKG_VERSION, release tag is $TAG_VERSION."
        exit 1
      fi
    - npx --yes @vscode/vsce package -o antigravity-arn-skin.vsix
  artifacts:
    paths:
      - antigravity-arn-skin.vsix
    expire_in: never

publish-marketplace:
  extends: .on-release
  image: node:22
  stage: deploy
  interruptible: false
  needs:
    - package
  script:
    - npx --yes @vscode/vsce publish --packagePath antigravity-arn-skin.vsix -p "$VSCE_PUBLISH"

publish-openvsx:
  extends: .on-release
  image: node:22
  stage: deploy
  interruptible: false
  needs:
    - package
  script:
    - npx --yes ovsx publish antigravity-arn-skin.vsix -p "$OPEN_VSX"

gitlab-release:
  extends: .on-release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  stage: deploy
  interruptible: false
  needs:
    - publish-marketplace
    - publish-openvsx
  script:
    - TAG_VERSION="${CI_COMMIT_TAG#v}"
    - echo "# What's new in v${TAG_VERSION} ?" > release_notes.md
    - echo "" >> release_notes.md
    - awk -v ver="[${TAG_VERSION}]" '/^## \[/ { if (p) exit; if (index($2, ver) == 1) { p=1; next } } p { print }' CHANGELOG.md >> release_notes.md
    - |
      release-cli create --name "Release $CI_COMMIT_TAG" \
        --tag-name "$CI_COMMIT_TAG" \
        --description "$(cat release_notes.md)" \
        --assets-link "{\"name\":\"Extension Binary (.vsix)\",\"url\":\"${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/antigravity-arn-skin.vsix?job=package\",\"filepath\":\"/antigravity-arn-skin.vsix\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"Download on VS Marketplace\",\"url\":\"https://marketplace.visualstudio.com/items?itemName=jzbakh.antigravity-arn-skin\",\"link_type\":\"other\"}" \
        --assets-link "{\"name\":\"Download on Open VSX\",\"url\":\"https://open-vsx.org/extension/jzbakh/antigravity-arn-skin\",\"link_type\":\"other\"}"
